name: Robustness
'on':
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # The scanner depends on the C library (e.g. `iswalpha`), and the Rust binding compiles it natively, so the
  # tests run on other common platforms too; the Test workflow covers ubuntu-latest.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
      - run: bun install --frozen-lockfile
      - run: bun run build/ci
      - run: bun run test/ci-setup
      # The packages ship the committed src/, so it must be what grammar.js generates.
      - run: git diff --exit-code -- src
      - run: bun run test/ci
  # Runs the parser under libFuzzer with AddressSanitizer and UndefinedBehaviorSanitizer, seeded with the
  # input of each corpus case. A grammar change alters which tokens the scanner is asked for, so it runs
  # on every change, not only on scanner changes. The parser is linked with the WillBooster/tree-sitter runtime
  # at the version of @willbooster/web-tree-sitter in package.json, the runtime this package is used with, since
  # the upstream runtime can recover from some errors forever. tree-sitter/fuzz-action provides the harness,
  # the dictionary, and the Makefile, but installs the upstream runtime itself.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: runtime
        run: echo "version=$(jq -r '.devDependencies["@willbooster/web-tree-sitter"]' package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: WillBooster/tree-sitter
          ref: v${{ steps.runtime.outputs.version }}
          path: .tmp/tree-sitter
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: tree-sitter/fuzz-action
          ref: v4
          path: .tmp/fuzz-action
          persist-credentials: false
      - run: |
          mkdir -p .tmp/fuzz-seeds
          awk -v dir=.tmp/fuzz-seeds '
            state != 2 && /^=+$/ { if (++state == 2) file = sprintf("%s/%d", dir, ++n); next }
            state == 2 && /^---+$/ { state = 0; close(file); next }
            state == 2 { print > file }
          ' $(find test/corpus -name '*.txt' | LC_ALL=C sort)
      # The Makefile links the runtime through pkg-config.
      - name: Build the runtime
        working-directory: .tmp/tree-sitter/lib
        run: |
          clang -std=c11 -O2 -g -fPIC -shared -D_POSIX_C_SOURCE=200112L -D_DEFAULT_SOURCE -Iinclude -Isrc src/lib.c \
            -o libtree-sitter.so
          printf '%s\n' 'Name: tree-sitter' 'Description: WillBooster/tree-sitter' 'Version: ${{ steps.runtime.outputs.version }}' \
            "Cflags: -I$PWD/include" "Libs: -L$PWD -Wl,-rpath,$PWD -ltree-sitter" > tree-sitter.pc
      - name: Fuzz
        working-directory: .tmp/fuzz-action
        # An explicit bash adds pipefail, so that a failure of make, not only of tee, fails the step.
        shell: bash
        run: make LANG_NAME="$(jq -r .name "$GITHUB_WORKSPACE/src/grammar.json")" |& tee >(perl annotate.pl)
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/.tmp/tree-sitter/lib
          LANG_DIR: ${{ github.workspace }}
          CORPUS_DIR: ${{ github.workspace }}/.tmp/fuzz-seeds
          MAX_TIME: '300'
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzzer-artifacts
          path: .tmp/fuzz-action/artifacts/
          retention-days: 7
